# Load Configuration and Appliance Event Schedule Model
# [재실 가정 및 이유]
# 월 합산 상계에서는 하루 안 사용 시각이 요금에 영향을 주지 않으며,
# 세컨하우스 재실일은 주로 주말·휴가이므로 종일 재실로 가정. 상주 케이스의 평일 낮 부하는 다소 과대(보수적).
# 정성 근거: 서현철 외(2012, 한국주택학회지 23권 6호) 06~08시 및 18~23시 전력 집중 패턴 반영.

standby_power:
  value: 45.0
  unit: "W"
  source: "한국전기연구원 전국 대기전력 실태조사 가구 평균 대기전력 (상시 가동)"
  status: "UNVERIFIED"

fridge_continuous_power:
  value: 35.0
  unit: "W"
  source: "한국에너지공단 냉장고 1등급 연간소비전력량(312 kWh/년) 환산 (상시 가동)"
  status: "UNVERIFIED"

water_purifier_continuous_power:
